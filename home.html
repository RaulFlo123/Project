<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tuff playlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="navbar">
    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="More.html">More Playlists</a></li>
      <li><a href="#">Contact</a></li>
      <li><a href="#">About</a></li>
    </ul>
  </nav>
</header>
<select id="sort">
  <option value="">Sort songs</option>
  <option value="title">Title (A-Z)</option>
  <option value="artist">Artist (A-Z)</option>
  <option value="date">Release Date (Newest)</option>
  <option value="duration">Duration (Shortest)</option>
</select>

<main>
  <section>
    <h2>Tuff Playlist</h2>
    <div id="controls">
      <input id="search" type="search" placeholder="Search title or artist" />
    </div>

    <div id="playlist" class="grid-container"></div>
    <audio id="player" controls></audio>
  </section>
</main>

<script src="design.js"></script>
</body>
</html>
